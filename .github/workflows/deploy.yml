name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Write .env.local from GitHub Secrets before building on server
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "echo 'VITE_MKT_WORKER_URL=${{ secrets.VITE_MKT_WORKER_URL }}' > /root/.openclaw/workspace/repos/personal-hub/.env.local"
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              /usr/local/bin/deploy-personal-hub
