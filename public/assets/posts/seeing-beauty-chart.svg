<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Noisy upward chart</title>
  <desc id="desc">A sharp, noisy chart line with dips, rebounds, and a long upward trajectory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17131f"/>
      <stop offset=".52" stop-color="#20172d"/>
      <stop offset="1" stop-color="#101b1d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset=".55" stop-color="#a88cff"/>
      <stop offset="1" stop-color="#79e7c6"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79e7c6" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#a88cff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.48 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 .62 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="44" fill="url(#bg)"/>
  <g opacity=".34" stroke="#f8f1e7" stroke-width="1">
    <path d="M140 160H1460M140 300H1460M140 440H1460M140 580H1460M140 720H1460M140 860H1460"/>
    <path d="M200 120V880M380 120V880M560 120V880M740 120V880M920 120V880M1100 120V880M1280 120V880M1460 120V880"/>
  </g>
  <path d="M140 790 L210 715 L285 760 L355 610 L425 645 L495 520 L565 555 L635 430 L705 465 L775 345 L845 390 L915 305 L985 355 L1055 250 L1125 300 L1195 205 L1265 260 L1335 155 L1405 205 L1460 135 L1460 880 L140 880 Z" fill="url(#fill)"/>
  <path d="M140 790 L210 715 L285 760 L355 610 L425 645 L495 520 L565 555 L635 430 L705 465 L775 345 L845 390 L915 305 L985 355 L1055 250 L1125 300 L1195 205 L1265 260 L1335 155 L1405 205 L1460 135" fill="none" stroke="url(#line)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M140 790 L210 715 L285 760 L355 610 L425 645 L495 520 L565 555 L635 430 L705 465 L775 345 L845 390 L915 305 L985 355 L1055 250 L1125 300 L1195 205 L1265 260 L1335 155 L1405 205 L1460 135" fill="none" stroke="#fff7ed" stroke-opacity=".72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff7ed" stroke="#17131f" stroke-width="8">
    <circle cx="285" cy="760" r="15"/>
    <circle cx="565" cy="555" r="15"/>
    <circle cx="845" cy="390" r="15"/>
    <circle cx="1125" cy="300" r="15"/>
    <circle cx="1405" cy="205" r="15"/>
  </g>
</svg>
