server {
    server_name nikpeg.me www.nikpeg.me;
    root /var/www/personal-hub;
    index index.html;

    access_log /var/log/nginx/personal-hub.access.log;
    error_log  /var/log/nginx/personal-hub.error.log;

    include /etc/nginx/nikpeg.d/*.conf;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate     /etc/ssl/nikpeg.me.pem;
    ssl_certificate_key /etc/ssl/nikpeg.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

server {
    if ($host = nikpeg.me)     { return 301 https://$host$request_uri; }
    if ($host = www.nikpeg.me) { return 301 https://nikpeg.me$request_uri; }

    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;

    server_name nikpeg.me www.nikpeg.me;
    return 404;
}
